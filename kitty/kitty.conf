# =============================================================================
# Kitty Configuration
# =============================================================================

include ./theme.dark.conf

# =============================================================================
# Fonts
# =============================================================================

font_family FiraCode Nerd Font Mono
bold_font auto
italic_font auto
bold_italic_font auto
font_size 14.0
disable_ligatures never

# =============================================================================
# Terminal
# =============================================================================

enable_audio_bell no
scrollback_lines 100000
shell_integration enabled
clipboard_control write-clipboard write-primary read-clipboard read-primary

# =============================================================================
# Window & Layout
# =============================================================================

background_opacity 0.80
remember_window_size yes
initial_window_width 1200
initial_window_height 800
hide_window_decorations yes
enabled_layouts splits, stack, tall, fat

# =============================================================================
# Mouse
# =============================================================================

mouse_map left click ungrabbed no-op
mouse_map ctrl+left click ungrabbed mouse_handle_click selection link prompt
mouse_map ctrl+left press ungrabbed mouse_selection normal
mouse_map right press ungrabbed copy_to_clipboard
mouse_hide_wait 3.0

# =============================================================================
# Keyboard shortcuts
# =============================================================================

# New tab in the current working directory
map ctrl+shift+t launch --type=tab --cwd=current

# --- Windows / splits ---------------------------------------------------

map ctrl+shift+/ launch --location=vsplit --cwd=current
map ctrl+shift+. launch --location=hsplit --cwd=current

map ctrl+shift+h neighboring_window left
map ctrl+shift+j neighboring_window down
map ctrl+shift+k neighboring_window up
map ctrl+shift+l neighboring_window right

# --- Pane resizing (10 cells) --------------------------------------------

map ctrl+shift+left  resize_window narrower 10
map ctrl+shift+right resize_window wider 10
map ctrl+shift+up    resize_window taller 10
map ctrl+shift+down  resize_window shorter 10

# --- Tabs ---------------------------------------------------------

map ctrl+shift+n next_tab
map ctrl+shift+p previous_tab

# --- Misc ------------------------------------------------------------------

map ctrl+shift+z toggle_layout stack
map ctrl+shift+f toggle_fullscreen
map ctrl+shift+, set_tab_title
