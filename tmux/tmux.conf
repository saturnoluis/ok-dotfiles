# =============================================================================
# Terminal
# =============================================================================

# Enable truecolor support and modern terminal emulation
set -g default-terminal "tmux-256color"
set-option -sa terminal-features ",alacritty*:RGB,kitty*:RGB,foot*:RGB,wezterm*:RGB,xterm*:RGB"

# Set a delay between prefix and command
set -s escape-time 3

# =============================================================================
# Prefix
# =============================================================================

# Keep the default C-b prefix and allow sending it to the shell
bind-key C-b send-prefix

# =============================================================================
# Windows & panes
# =============================================================================

# Start numbering at 1 instead of 0
set -g base-index 1
set -g pane-base-index 1

# Renumber windows automatically when one is closed
set -g renumber-windows on

# Update terminal title with current session and window
set -g set-titles on
set -g set-titles-string "#S | #I:#W"

# Bind key to reload configuration file
bind r source-file ~/.config/tmux/tmux.conf \; display-message "Reloaded!"

# Open a popup terminal in the current directory
bind p popup -E -d "#{pane_current_path}" -w 90% -h 90%

# Splitting panes with | and - (inherits the current directory)
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind n new-window

# Switch windows with Alt+number
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9

# Vim-style pane navigation
bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

# Vim-style pane resizing
bind-key H resize-pane -L 10
bind-key J resize-pane -D 10
bind-key K resize-pane -U 10
bind-key L resize-pane -R 10

# =============================================================================
# Copy mode
# =============================================================================

# Vim keybindings
setw -g mode-keys vi

# Copy to system clipboard via OSC52 (works over SSH, Wayland and X11)
set -g set-clipboard on
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "tmux load-buffer -"

# Enable mouse support
set -g mouse on

# =============================================================================
# Plugins (TPM)
# =============================================================================

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'niksingh710/minimal-tmux-status'

# Plugin configs: tmux-resurrect
set -g @resurrect-strategy-nvim "session"
set -g @resurrect-capture-pane-contents "on"

# Plugin configs: minimal-tmux-status
set -g @minimal-tmux-justify "left"
set -g @minimal-tmux-indicator false
set -g @minimal-tmux-right false

run '~/.config/tmux/plugins/tpm/tpm'

# =============================================================================
# Status bar
# =============================================================================

# Move status bar on top
set-option -g status-position top

# =============================================================================
# Misc
# =============================================================================

# Increase history limit
set -g history-limit 100000

# Enable focus-events for better integration with nvim
set-option -g focus-events on
